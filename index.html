<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SUN Visualizer — learn data structures &amp; algorithms with animation</title>
<style>
:root {
  --bg-void: #0a0e16;
  --bg-panel: #10161f;
  --bg-elevated: #161f2e;
  --bg-elevated-2: #1c2740;
  --border: #232f42;
  --border-bright: #34455f;
  --text-primary: #e8edf5;
  --text-muted: #8a97ac;
  --text-dim: #57647c;
  --accent-blue: #6ab0f3;
  --accent-blue-dim: #3a5a80;
  --accent-green: #7ee787;
  --accent-green-dim: #2f5c3a;
  --accent-orange: #ffa759;
  --accent-orange-dim: #6b4b2a;
  --accent-purple: #d2a8ff;
  --accent-purple-dim: #4a3a6b;
  --accent-red: #ff7b72;
  --accent-red-dim: #6b3530;
  --accent-cyan: #56d4dd;
  --accent-cyan-dim: #2a5458;
  --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius-sm: 4px;
  --radius-md: 7px;
  --radius-lg: 11px;
  --transition-fast: 0.15s ease;
  --transition-med: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg-void);
  color: var(--text-primary);
  font-family: var(--font-sans);
  height: 100%;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(106, 176, 243, 0.07), transparent),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(210, 168, 255, 0.05), transparent);
  background-attachment: fixed;
}
::selection { background: var(--accent-blue-dim); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
a { color: var(--accent-blue); }
button {
  font-family: inherit;
  cursor: pointer;
}
:focus-visible {
  outline: 2px solid var(--accent-blue);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  min-height: 560px;
}
#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: var(--bg-void);
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(106, 176, 243, 0.07), transparent),
    radial-gradient(ellipse 700px 500px at 100% 10%, rgba(210, 168, 255, 0.05), transparent);
}
.boot-window {
  width: min(520px, 88vw);
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 20px 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.boot-window .titlebar-dots { margin-bottom: 16px; }
.boot-log {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 1.9;
  color: var(--text-muted);
  min-height: 210px;
  max-height: 210px;
  overflow: hidden;
}
.boot-line { animation: boot-line-in 0.25s ease; }
.boot-line.boot-ready { color: var(--accent-green); font-weight: 600; }
@keyframes boot-line-in { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; transform: translateX(0); } }
.boot-progress {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-elevated-2);
  overflow: hidden;
  margin-top: 14px;
}
.boot-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
  transition: width 0.15s ease;
