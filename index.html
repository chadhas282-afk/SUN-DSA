<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>SUN Visualizer — learn data structures &amp; algorithms with animation</title>
  <style>
    :root {
      --bg-void: #0a0e16;
      --bg-panel: #10161f;
      --bg-elevated: #161f2e;
      --bg-elevated-2: #1c2740;
      --border: #232f42;
      --border-bright: #34455f;
      --text-primary: #e8edf5;
      --text-muted: #8a97ac;
      --text-dim: #57647c;
      --accent-blue: #6ab0f3;
      --accent-blue-dim: #3a5a80;
      --accent-green: #7ee787;
      --accent-green-dim: #2f5c3a;
      --accent-orange: #ffa759;
      --accent-orange-dim: #6b4b2a;
      --accent-purple: #d2a8ff;
      --accent-purple-dim: #4a3a6b;
      --accent-red: #ff7b72;
      --accent-red-dim: #6b3530;
      --accent-cyan: #56d4dd;
      --accent-cyan-dim: #2a5458;
      --font-mono: "JetBrains Mono", "Fira Code", ui-monospace, "SF Mono", "Cascadia Code", Consolas, "Roboto Mono", monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --radius-sm: 4px;
      --radius-md: 7px;
      --radius-lg: 11px;
      --transition-fast: 0.15s ease;
      --transition-med: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100%;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(106, 176, 243, 0.07), transparent),
        radial-gradient(ellipse 700px 500px at 100% 10%, rgba(210, 168, 255, 0.05), transparent);
      background-attachment: fixed;
    }

    ::selection {
      background: var(--accent-blue-dim);
      color: #fff;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-dim);
    }

    a {
      color: var(--accent-blue);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    :focus-visible {
      outline: 2px solid var(--accent-blue);
      outline-offset: 2px;
      border-radius: var(--radius-sm);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-height: 560px;
    }

    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: var(--bg-void);
      background-image:
        radial-gradient(ellipse 900px 500px at 15% -10%, rgba(106, 176, 243, 0.07), transparent),
        radial-gradient(ellipse 700px 500px at 100% 10%, rgba(210, 168, 255, 0.05), transparent);
    }

    .boot-window {
      width: min(520px, 88vw);
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .boot-window .titlebar-dots {
      margin-bottom: 16px;
    }

    .boot-log {
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.9;
      color: var(--text-muted);
      min-height: 210px;
      max-height: 210px;
      overflow: hidden;
    }

    .boot-line {
      animation: boot-line-in 0.25s ease;
    }

    .boot-line.boot-ready {
      color: var(--accent-green);
      font-weight: 600;
    }

    @keyframes boot-line-in {
      from {
        opacity: 0;
        transform: translateX(-4px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .boot-progress {
      height: 4px;
      border-radius: 2px;
      background: var(--bg-elevated-2);
      overflow: hidden;
      margin-top: 14px;
    }

    .boot-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
      transition: width 0.15s ease;
    }

    .boot-skip {
      margin-top: 12px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-dim);
      text-align: center;
    }

    #mainShell {
      display: none;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      animation: shell-in 0.4s ease;
    }

    @keyframes shell-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .titlebar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      height: 44px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      z-index: 30;
    }

    .titlebar-dots {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .titlebar-dots span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
    }

    .titlebar-dots span:nth-child(1) {
      background: #ff5f57;
    }

    .titlebar-dots span:nth-child(2) {
      background: #febc2e;
    }

    .titlebar-dots span:nth-child(3) {
      background: #28c840;
    }

    .titlebar-title {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .titlebar-title {
      cursor: pointer;
    }

    .titlebar-title strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .titlebar-cursor {
      display: inline-block;
      width: 7px;
      height: 14px;
      background: var(--accent-green);
      margin-left: 2px;
      vertical-align: -2px;
      animation: blink 1.1s step-end infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .titlebar-cursor {
        animation: none;
        opacity: 1;
      }
    }

    .titlebar-spacer {
      flex: 1;
    }

    .sidebar-toggle {
      display: none;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      width: 32px;
      height: 32px;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .titlebar-hint {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .titlebar-hint kbd {
      font-family: inherit;
      background: var(--bg-elevated);
      border: 1px solid var(--border-bright);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text-muted);
    }

    .body-row {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .sidebar {
      display: none !important;
      width: 250px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 14px 8px 24px;
    }

    .sidebar-brand {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
      padding: 4px 10px 12px;
    }

    .tree-category {
      margin-bottom: 2px;
    }

    .tree-category-label {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.03em;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      text-align: left;
    }

    .tree-category-label:hover {
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    .tree-caret {
      display: inline-block;
      transition: transform var(--transition-fast);
      font-size: 10px;
      color: var(--text-dim);
    }

    .tree-category.collapsed .tree-caret {
      transform: rotate(-90deg);
    }

    .tree-category.collapsed .tree-items {
      display: none;
    }

    .tree-items {
      padding-left: 8px;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      background: none;
      border: none;
      border-left: 2px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 7px 10px 7px 14px;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      text-align: left;
      margin: 1px 0;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .tree-item-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--dot-color, var(--accent-blue));
    }

    .tree-item:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
    }

    .tree-item.active {
      background: var(--bg-elevated-2);
      color: var(--text-primary);
      border-left-color: var(--accent-blue);
    }

    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 22px 28px 48px;
    }

    .breadcrumb {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    .breadcrumb .sep {
      margin: 0 6px;
      color: var(--border-bright);
    }

    .breadcrumb .current {
      color: var(--text-muted);
    }

    .breadcrumb-home {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      cursor: pointer;
      padding: 0;
    }

    .breadcrumb-home:hover {
      color: var(--accent-blue);
    }

    .topic-header h1 {
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }

    .topic-header p.desc {
      color: var(--text-muted);
      font-size: 14.5px;
      line-height: 1.6;
      max-width: 74ch;
      margin: 0 0 14px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 22px;
    }

    .badge {
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-bright);
      background: var(--bg-elevated);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .badge b {
      color: var(--text-primary);
      font-weight: 600;
    }

    .badge.badge-time {
      border-color: var(--accent-orange-dim);
    }

    .badge.badge-time b {
      color: var(--accent-orange);
    }

    .badge.badge-space {
      border-color: var(--accent-purple-dim);
    }

    .badge.badge-space b {
      color: var(--accent-purple);
    }

    .badge.badge-stable {
      border-color: var(--accent-green-dim);
    }

    .badge.badge-stable b {
      color: var(--accent-green);
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      overflow: hidden;
    }

    .panel-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-label span:last-child {
      text-transform: none;
      letter-spacing: normal;
      color: var(--text-muted);
    }

    .viz-stage {
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }

    .viz-stage svg {
      width: 100%;
      height: auto;
      max-height: 420px;
      display: block;
    }

    .controls-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-icon {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-elevated-2);
      border: 1px solid var(--border-bright);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      transition: background var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
    }

    .btn-icon:hover:not(:disabled) {
      background: var(--accent-blue-dim);
      border-color: var(--accent-blue);
    }

    .btn-icon:active:not(:disabled) {
      transform: scale(0.93);
    }

    .btn-icon:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-icon svg {
      width: 15px;
      height: 15px;
    }

    .btn-play {
      width: auto;
      padding: 0 14px;
      gap: 7px;
      background: var(--accent-blue-dim);
      border-color: var(--accent-blue);
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
    }

    .btn-play:hover:not(:disabled) {
      background: var(--accent-blue);
      color: #08131f;
      }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .speed-control label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .speed-control input[type=range] {
      width: 90px;
      accent-color: var(--accent-blue);
    }

    .control-divider {
      width: 1px;
      height: 22px;
      background: var(--border-bright);
    }

    .btn-text {
      background: var(--bg-elevated-2);
      border: 1px solid var(--border-bright);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 12.5px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      gap: 7px;
      transition: background var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast);
    }

    .btn-text:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      border-color: var(--text-dim);
    }

    .btn-text svg {
      width: 13px;
      height: 13px;
    }

    .btn-text.btn-primary {
      background: var(--accent-green-dim);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }

    .btn-text.btn-primary:hover {
      background: var(--accent-green);
      color: #06210c;
    }

    .field-inline {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .field-inline label {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-dim);
    }

    .field-inline input[type=text],
    .field-inline input[type=number] {
      background: var(--bg-void);
      border: 1px solid var(--border-bright);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12.5px;
